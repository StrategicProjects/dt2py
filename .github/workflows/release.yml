name: Release to PyPI

# Fires only when the maintainer publishes a GitHub Release. Uses PyPI Trusted
# Publishing (OIDC) — configure the publisher on PyPI first; no token is stored.
on:
  release:
    types: [published]
  # Manual re-run from main, for when a release-triggered publish fails for a
  # reason that needs a workflow fix (a `release` run always uses the workflow
  # file at the tagged commit). Publishes whatever version main declares.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build JS bundle
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        # Pinned to a commit SHA (not a moving branch/tag) — this step runs with
        # id-token: write (PyPI publish rights), so a hijacked ref must not be
        # able to execute here. SHA is v1.14.2 (Twine 7: needed for the
        # Metadata-Version 2.5 that current hatchling emits).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
